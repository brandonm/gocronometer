name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      # Offline unit tests run here. The live Cronometer API tests in
      # gocronometer_test.go skip automatically when GOCRONOMETER_TEST_* are unset.
      - name: Test
        run: go test -v ./...
